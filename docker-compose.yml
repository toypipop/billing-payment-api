services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing-payment-api
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: billing-payment-postgres
    environment:
      POSTGRES_DB: billing_payment
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d billing_payment"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: billing-payment-swagger-ui
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
